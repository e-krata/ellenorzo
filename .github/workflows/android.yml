name: Build for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.0.3
        with:
          fileName: upload-keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        working-directory: refilc/android
        run: |
          cat > key.properties <<EOF
          storeFile=${{ steps.android_keystore.outputs.filePath }}
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          EOF

      - name: Install Flutter dependencies
        working-directory: refilc
        run: flutter pub get

      - name: Clean previous build
        working-directory: refilc
        run: flutter clean

      - name: Build Android release
        working-directory: refilc
        run: ./build.sh

      - name: List generated APKs
        working-directory: refilc
        run: |
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -print

      - name: Upload Android Release
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: refilc/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
:::

