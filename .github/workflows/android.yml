name: Build for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.0.3
        with:
          fileName: upload-keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        working-directory: refilc/android
        run: |
          cat > key.properties <<EOF
          storeFile=${{ steps.android_keystore.outputs.filePath }}
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          EOF

      - name: Install dependencies
        working-directory: refilc
        run: flutter pub get

      - name: Clean Flutter build
        working-directory: refilc
        run: flutter clean

      - name: Build Android release
        working-directory: refilc
        run: ./build.sh

      - name: Show generated APKs
        working-directory: refilc
        run: |
          find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Android Release
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: refilc/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
:::

### 2. `refilc/android/build.gradle`

:::writing{variant="document" id="85304" title="refilc/android/build.gradle"}
```gradle
allprojects {
    repositories {
        google()
        mavenCentral()

        // Required by background_fetch.
        maven {
            url "${project(':background_fetch').projectDir}/libs"
        }
    }
}

/*
 * All Android plugins in the project, including old Flutter plugins such as
 * image_crop, must compile against a modern Android SDK.
 *
 * This is important because image_crop references android:attr/lStar,
 * which is unavailable when that library is compiled against an old SDK.
 */
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application') ||
            project.plugins.hasPlugin('com.android.library') ||
            project.plugins.hasPlugin('android') ||
            project.plugins.hasPlugin('android-library')) {

            project.android {
                compileSdk 35
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}