allprojects {
    repositories {
        google()
        mavenCentral()
        // jcenter is deprecated but some old plugins still need it
        jcenter()
        maven {
            // [required] background_fetch
            url "${project(':background_fetch').projectDir}/libs"
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Auto-fix missing namespace for old Flutter plugins (AGP 8+)
// IMPORTANT: do this WITHOUT evaluationDependsOn, and only on library plugins
subprojects { project ->
    project.plugins.withId("com.android.library") {
        def android = project.extensions.findByName("android")
        if (android != null && (android.namespace == null || android.namespace.toString().trim().isEmpty())) {
            def fallback = project.group?.toString()?.trim()
            if (fallback == null || fallback.isEmpty() || fallback == "unspecified") {
                fallback = "com.example.${project.name.replace('-', '_')}"
            }
            android.namespace = fallback
            println "Set namespace for ${project.name}: ${fallback}"
        }
    }
}

// Optional: force a modern compileSdk on old plugins
subprojects { project ->
    project.plugins.withId("com.android.library") {
        def android = project.extensions.findByName("android")
        if (android != null) {
            try {
                if (android.compileSdkVersion == null) {
                    android.compileSdkVersion = 35
                }
            } catch (Ignored) {
                // ignore plugins that expose compileSdk differently
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}